# Xcode project for the iPhone app, generated by XcodeGen.
#
# The Mac app builds through SwiftPM + make.sh and needs no project file. iOS does: code
# signing, device deployment and TestFlight all require one. Keeping the spec in version
# control and generating the .xcodeproj means no 20,000-line pbxproj in diffs.
#
#   brew install xcodegen   # if missing
#   xcodegen generate
#
# Building for a device, archiving, or uploading to TestFlight additionally needs a Team
# ID from an enrolled Apple Developer account (developer.apple.com/account → Membership).
# Pass it as an environment variable rather than hardcoding it, since it doesn't exist
# until that account does:
#
#   export DEVELOPMENT_TEAM=ABCDE12345
#   xcodegen generate
#
# Simulator builds need no team and work with this unset.
#
# Syncing the sidecar through iCloud needs the same account, plus a CloudKit container
# named `iCloud.com.brandonlopez.RemindersCompanion` created in the portal. Once both
# exist, switch the entitlements on too — until then the phone reads a local sidecar and
# the app says so:
#
#   export MOBILE_ENTITLEMENTS=signing/RemindersCompanionMobile.entitlements
name: RemindersCompanionMobile

options:
  bundleIdPrefix: com.brandonlopez
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  RemindersCore:
    path: .

targets:
  RemindersCompanionMobile:
    type: application
    platform: iOS
    sources:
      - path: Sources/RemindersCompanionMobile
    dependencies:
      - package: RemindersCore
        product: RemindersCore
      # The iPhone side of the Watch bridge: it performs the writes the Watch cannot.
      - package: RemindersCore
        product: RemindersShared
      - target: RemindersCompanionWidgets
        embed: true
      - target: RemindersCompanionWatch
        embed: true
    info:
      path: Sources/RemindersCompanionMobile/Info.plist
      properties:
        CFBundleDisplayName: Companion
        # Taken from the build settings rather than written out again. These were literals
        # ("1.0" / "1") and drifted away from both MARKETING_VERSION and the repo's tags,
        # which is how the shipped app came to report a different version from the release
        # it was built from.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - reminderscompanion
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSRemindersFullAccessUsageDescription: >-
          Reminders Companion shows the reminders you already have in a weekly planning
          view. Your tasks stay in Reminders and your existing notifications are never
          changed.
        NSCalendarsFullAccessUsageDescription: >-
          Reminders Companion can overlay your calendar so you can see which days are
          already booked. Events are only ever read, never changed.
        CFBundleIconName: AppIcon
        # The app uses no cryptography beyond what iOS itself provides (Keychain, HTTPS).
        # This is a truthful "no" that also skips App Store Connect's export-compliance
        # question on every upload — leaving it unset makes the question reappear each time.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brandonlopez.RemindersCompanionMobile
        MARKETING_VERSION: "1.4.0"
        # App Store Connect requires each upload to carry a higher build number than the
        # last, within a given marketing version. Bump with ./bump-build.sh before
        # archiving, not by hand.
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_STRICT_CONCURRENCY: complete
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        # Left empty until there is a team to authorise it. iCloud is a capability the
        # portal has to grant, and switching it on without one fails the build outright —
        # including simulator builds, which otherwise need no signing at all. Set it
        # alongside DEVELOPMENT_TEAM and the phone joins the sync:
        #   export MOBILE_ENTITLEMENTS=signing/RemindersCompanionMobile.entitlements
        CODE_SIGN_ENTITLEMENTS: ${MOBILE_ENTITLEMENTS}

  RemindersCompanionWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/RemindersCompanionWidgets
    dependencies:
      - package: RemindersCore
        product: RemindersCore
    info:
      path: Sources/RemindersCompanionWidgets/Info.plist
      properties:
        CFBundleDisplayName: Companion Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        # Duplicated from the main app's Info.plist. Whether TCC resolves an extension's
        # Reminders/Calendar prompt through the containing app or checks the extension's
        # own bundle varies by iOS version, so both carry the real strings rather than
        # leaving the widget's blank and hoping.
        NSRemindersFullAccessUsageDescription: >-
          Reminders Companion shows the reminders you already have in a weekly planning
          view. Your tasks stay in Reminders and your existing notifications are never
          changed.
        NSCalendarsFullAccessUsageDescription: >-
          Reminders Companion can overlay your calendar so you can see which days are
          already booked. Events are only ever read, never changed.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brandonlopez.RemindersCompanionMobile.Widgets
        # Apple requires an extension's marketing version to match its containing app's.
        # bump-build.sh's build-number substitution matches this line too, since it
        # patches every CURRENT_PROJECT_VERSION occurrence in the file.
        MARKETING_VERSION: "1.4.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: NO

  RemindersCompanionWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Sources/RemindersCompanionWatch
    dependencies:
      - package: RemindersCore
        product: RemindersCore
      - package: RemindersCore
        product: RemindersShared
      - target: RemindersCompanionWatchWidgets
        embed: true
    info:
      path: Sources/RemindersCompanionWatch/Info.plist
      properties:
        CFBundleDisplayName: Companion
        # Required for a modern (single-target) watchOS app; without it the install is
        # rejected outright with "missing either the WKWatchKitApp or WKApplication key".
        WKApplication: true
        # Ties the watch app to its iPhone counterpart so they install as one product.
        WKCompanionAppBundleIdentifier: com.brandonlopez.RemindersCompanionMobile
        WKRunsIndependentlyOfCompanionApp: false
        NSRemindersFullAccessUsageDescription: >-
          Reminders Companion shows what's due today on your wrist. Your tasks stay in
          Reminders and your existing notifications are never changed.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brandonlopez.RemindersCompanionMobile.watchkitapp
        MARKETING_VERSION: "1.4.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: NO

  RemindersCompanionWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Sources/RemindersCompanionWatchWidgets
    dependencies:
      - package: RemindersCore
        product: RemindersCore
    info:
      path: Sources/RemindersCompanionWatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: Companion
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSRemindersFullAccessUsageDescription: >-
          Reminders Companion shows what's due today on your watch face. Your tasks stay in
          Reminders and your existing notifications are never changed.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brandonlopez.RemindersCompanionMobile.watchkitapp.widgets
        MARKETING_VERSION: "1.4.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: NO
