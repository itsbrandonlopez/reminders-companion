# Xcode project for the iPhone app, generated by XcodeGen.
#
# The Mac app builds through SwiftPM + make.sh and needs no project file. iOS does: code
# signing, device deployment and TestFlight all require one. Keeping the spec in version
# control and generating the .xcodeproj means no 20,000-line pbxproj in diffs.
#
#   brew install xcodegen   # if missing
#   xcodegen generate
#
# Building for a device, archiving, or uploading to TestFlight additionally needs a Team
# ID from an enrolled Apple Developer account (developer.apple.com/account → Membership).
# Pass it as an environment variable rather than hardcoding it, since it doesn't exist
# until that account does:
#
#   export DEVELOPMENT_TEAM=ABCDE12345
#   xcodegen generate
#
# Simulator builds need no team and work with this unset.
name: RemindersCompanionMobile

options:
  bundleIdPrefix: com.brandonlopez
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  RemindersCore:
    path: .

targets:
  RemindersCompanionMobile:
    type: application
    platform: iOS
    sources:
      - path: Sources/RemindersCompanionMobile
    dependencies:
      - package: RemindersCore
        product: RemindersCore
    info:
      path: Sources/RemindersCompanionMobile/Info.plist
      properties:
        CFBundleDisplayName: Companion
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSRemindersFullAccessUsageDescription: >-
          Reminders Companion shows the reminders you already have in a weekly planning
          view. Your tasks stay in Reminders and your existing notifications are never
          changed.
        NSCalendarsFullAccessUsageDescription: >-
          Reminders Companion can overlay your calendar so you can see which days are
          already booked. Events are only ever read, never changed.
        CFBundleIconName: AppIcon
        # The app uses no cryptography beyond what iOS itself provides (Keychain, HTTPS).
        # This is a truthful "no" that also skips App Store Connect's export-compliance
        # question on every upload — leaving it unset makes the question reappear each time.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brandonlopez.RemindersCompanionMobile
        MARKETING_VERSION: "1.0"
        # App Store Connect requires each upload to carry a higher build number than the
        # last, within a given marketing version. Bump with ./bump-build.sh before
        # archiving, not by hand.
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_STRICT_CONCURRENCY: complete
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
